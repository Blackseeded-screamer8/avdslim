name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # A tag must never publish a build that fails the checks ci.yml runs.
      - name: Verify
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          
          # Extract release notes from CHANGELOG.md
          awk -v ver="${VERSION}" '
            $0 ~ "^## "ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/release_notes.md

          # Target platforms
          PLATFORMS=(
            "darwin/arm64"
            "darwin/amd64"
            "linux/amd64"
            "linux/arm64"
          )
          
          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            OUTPUT_NAME="avdslim_${VERSION}_${GOOS}_${GOARCH}"
            DIR="dist/${OUTPUT_NAME}"
            mkdir -p "${DIR}"
            
            echo "Building for ${GOOS}/${GOARCH}..."
            CGO_ENABLED=0 GOOS=${GOOS} GOARCH=${GOARCH} go build -ldflags="-s -w -X main.version=${VERSION}" -o "${DIR}/avdslim" ./cmd/avdslim
            cp README.md LICENSE "${DIR}/"
            
            tar -czvf "dist/${OUTPUT_NAME}.tar.gz" -C "dist" "${OUTPUT_NAME}"
          done
          
          cd dist
          shasum -a 256 *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          body_path: dist/release_notes.md
          generate_release_notes: true
