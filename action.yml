name: 'AVD-SLIM — Android Emulator RAM & CI Optimizer'
description: 'Cut Android emulator host memory from ~8.5 GB to ~2.5 GB on GitHub Actions CI runners for faster, parallel UI testing.'
author: 'kdbhalala'
branding:
  icon: 'zap'
  color: 'green'

inputs:
  ram:
    description: 'Target RAM allocation in MB (default: 1536)'
    required: false
    default: '1536'
  install-shim:
    description: 'Transparently wrap Android SDK emulator binary so all CI scripts/Gradle tasks run slimmed'
    required: false
    default: 'true'
  watch:
    description: 'Start background watcher daemon to auto-prune bloatware upon boot'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Download & Install AVD-SLIM
      shell: bash
      run: |
        echo "⚡ Installing AVD-SLIM on CI runner..."
        if command -v avdslim >/dev/null 2>&1; then
          echo "avdslim already installed: $(avdslim version)"
        else
          # The installer from this action's own ref (e.g. @v1.0.13), not main.
          bash "${{ github.action_path }}/install.sh"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
        fi

    - name: Configure Emulator Shim
      if: inputs.install-shim == 'true'
      shell: bash
      env:
        RAM: ${{ inputs.ram }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        avdslim install-shim "--ram=$RAM"

    - name: Start AVD-SLIM Watcher
      if: inputs.watch == 'true'
      shell: bash
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        nohup avdslim watch > /tmp/avdslim-watch.log 2>&1 &
        echo "👀 AVD-SLIM Watcher active in background."
